services:
  - type: web
    name: classy-fashion-hub
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./deploy
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Classy Fashion Hub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEBUG_ALLOWED_IPS
        value: ""
      - key: APP_URL
        value: https://classy-fashion-hub.onrender.com
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: FLUTTERWAVE_SANDBOX
        value: "true"
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: SEED_DEMO
        value: "true"
      # Production credentials (classy:secure-accounts). With SEED_DEMO=true the
      # demo worker/customer accounts exist, so SET the three passwords below to
      # the ones you will hand to testers; blank = random, printed ONCE in the
      # deploy log. SET SEED_ADMIN_PASSWORD BEFORE DEPLOYING or the admin login
      # will be a random password you must dig out of that log.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_WORKER_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      # Optional shop-assistant LLM (blank = rule-based answers only).
      - key: AI_LLM_API_KEY
        sync: false

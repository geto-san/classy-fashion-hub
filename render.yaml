services:
  - type: web
    name: classy-fashion-hub
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/classy-entrypoint.sh /usr/local/bin/classy-serve.sh
    healthCheckPath: /up
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_NAME
        value: Classy Fashion Hub
      - key: APP_ENV
        value: production
      - key: CLASSY_COURSEWORK_MODE
        value: "true"
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEBUG_ALLOWED_IPS
        value: ""
      - key: APP_URL
        value: https://classy-fashion-hub.onrender.com
      - key: APP_TIMEZONE
        value: Africa/Kampala
      # Reuse the existing Railway key to preserve encrypted business data.
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_DIRECT_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: MIGRATE_ON_BOOT
        value: "false"
      - key: INITIALIZE_STORE
        value: "false"
      - key: FILESYSTEM_DISK
        value: public
      - key: PUBLIC_FILESYSTEM_DRIVER
        value: cloudinary
      - key: PRIVATE_FILESYSTEM_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Classy Fashion Hub
      - key: MOMO_PROVIDER
        value: auto
      - key: MOMO_TILL_NUMBER
        sync: false
      - key: MTN_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_API_USER_ID
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: SEED_DEMO
        value: "false"
      # Optional shop-assistant LLM (blank = rule-based answers only).
      - key: AI_LLM_API_KEY
        sync: false
